[project]
name = "rtether"
version = "0.1.0"
description = "Reverse USB tethering relay: gives an Android phone this PC's internet"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rtether = "rtether.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
